services:

  postgres:
    image: postgres:18
    container_name: whodis-postgres

    environment:
      POSTGRES_DB: whodis
      POSTGRES_USER: whodis
      POSTGRES_PASSWORD: whodis

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whodis -d whodis"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: