[project]
name = "ml-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "srayan", email = "bhattacharyasrayan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "insightface>=2.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ml-service = "ml_service:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
override-dependencies = [
    { package = { name = "insightface" }, dependencies = ["onnxruntime-gpu==1.30.0"] },
]

exclude-dependencies = [
    { package = { name = "insightface" }, dependencies = ["onnxruntime"] },
]