events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Allow large file uploads for high-resolution photo batches
    client_max_body_size 1000M;

    # Upstream services
    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend {
        server backend:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Next.js HMR or real-time connections if needed
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # API routing to Spring Boot backend
        location /api/v1/ {
            proxy_pass http://backend/api/v1/;
            proxy_read_timeout 300s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            
            # Disable buffering for smooth streaming of ZIP downloads and image responses
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Legacy or internal backend proxy route support
        location /api/backend/ {
            proxy_pass http://backend/api/v1/;
            proxy_read_timeout 300s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;

            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Frontend Next.js application
        location / {
            proxy_pass http://frontend;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
        }
    }
}
