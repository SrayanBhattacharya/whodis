spring:
  application:
    name: whodis-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/whodis}
    username: ${DB_USERNAME:whodis}
    password: ${DB_PASSWORD:whodis}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 1000MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

whodis:
  session:
    duration: ${SESSION_DURATION:48h}

  storage:
    root: ${STORAGE_ROOT:./storage}

  ml:
    base-url: ${ML_SERVICE_URL:http://localhost:8001}

  face-matching:
    similarity-threshold: 0.51
    minimum-margin: 0.05

  processing:
    worker:
      pending-idle-time: 5m
      recovery-interval: 30000
      max-attempts: 3
      retry-delays: 10s
      reconciliation-interval: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info