spring:
  application:
    name: whodis-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/whodis}
    username: ${DB_USERNAME:whodis}
    password: ${DB_PASSWORD:whodis}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

whodis:
  session:
    duration: ${SESSION_DURATION:24h}

  storage:
    root: ${STORAGE_ROOT:./storage}

  ml:
    base-url: ${ML_SERVICE_URL:http://localhost:8001}

management:
  endpoints:
    web:
      exposure:
        include: health,info