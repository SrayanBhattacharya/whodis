spring:
  application:
    name: whodis-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/whodis}
    username: ${DB_USERNAME:whodis}
    password: ${DB_PASSWORD:whodis}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info